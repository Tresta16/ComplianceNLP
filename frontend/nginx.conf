server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://compliancenlp-serving:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://compliancenlp-serving:8080/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://compliancenlp-serving:8080/ready;
        proxy_set_header Host $host;
    }

    location /extract {
        proxy_pass http://compliancenlp-serving:8080/extract;
        proxy_set_header Host $host;
    }

    location /analyze_gap {
        proxy_pass http://compliancenlp-serving:8080/analyze_gap;
        proxy_set_header Host $host;
    }
}
